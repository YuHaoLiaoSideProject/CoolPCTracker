# .github/workflows/crawl.yml
# 每日排程與 GitHub Pages 部署（功能 002）
# 規格：docs/development/002-scheduler-and-pages-deploy.md（§1.2-§1.4、§6、§9.3-§9.4）
# BDD：docs/bdds/002-scheduler-and-pages-deploy.feature（12 scenarios）
name: Crawl & Deploy

on:
  schedule:
    - cron: '0 6 * * *'        # 每日 06:00 UTC（台北 14:00），錯開原價屋上午更新
                               # BDD @happy-path @daily：每日排程觸發
  workflow_dispatch: {}        # 維護者於 Actions 頁面手動補爬（與 cron 共用同一管線）
                               # BDD @happy-path @manual-trigger / @edge-case：手動補爬

# 頂層權限預設空；各 job 以最小權限自行宣告（§1.2/§1.3 權限最小化）
permissions: {}

concurrency:
  group: pages-deploy          # cron 與 workflow_dispatch 同 group → 同時僅一 run 執行寫入
  cancel-in-progress: false    # 新 run 進入 pending 等待，不取消進行中的 run
                               # BDD @edge-case @robustness：並發觸發不產生 commit 衝突/檔名重複

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 僅資料 commit/push 所需；不給 pages/id-token（權限最小化）
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
                               # 顯式取「job 執行當下」的 main tip：預設 checkout 用觸發時點 GITHUB_SHA，
                               # 若前一次 run 或並發 run 剛 push 過，工作目錄會拿到舊的資料基準（BDD @edge-case @robustness）
          fetch-depth: 1       # api/ 不再進版控，無需 fetch 比對；data/ 為唯一真相

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            crawler/pyproject.toml
            crawler/requirements.txt
            crawler/requirements-dev.txt

      - name: Install crawler dependencies (locked)
        run: |
          # 依 lock 檔安裝（含間接依賴固定版本），不再讓 pip 每日重新解析 pyproject 範圍約束
          pip install -r crawler/requirements-dev.txt
          pip install -e ./crawler --no-deps
        # 2026-10 selectolax 1.0 移除 Modest backend：舊版 `pip install -e ./crawler`
        # 會安裝到 1.0.x 並於 import 即 ImportError，排程連續 36 天失敗。
        # requirements-dev.txt = requirements.txt（執行期鎖定）＋ pytest/pytest-mock。
        # --no-deps：依賴已由 lock 檔安裝；避免 pip 重新解析並升級到未鎖定版本。

      - name: Import smoke test (selectolax lexbor backend)
        run: |
          python -c "import selectolax; from crawler.parser import Parser; from crawler.main import main; print('import ok selectolax', selectolax.__version__)"
        # 2 秒內抓出 breaking import（本類故障的原始症狀），早於任何網路抓取

      - name: Run crawler unit tests
        run: python -m pytest crawler/tests -q
        # parser 壞掉（依賴 API 變更、DOM 假設失效）→ 測試紅 → step 失敗 → 不執行排程與部署

      - name: Run crawler (feature 001)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m crawler.main --data-dir data
        # exit code 契約：0 成功（含 partial）；1 健康檢查擋下；2 其他執行失敗
        # 非零 → step 失敗 → job 失敗 → deploy 因 needs 不啟動；舊資料不被覆寫（001 原子寫入）
        # BDD @error-handling @p0：爬蟲執行失敗時保留舊資料且不部署
        # env：crawler/main.py 以 scripts/telegram_hook.py 的 notify() 注入告警，
        # 憑證只在此 step 與 Telegram 相關 step 提供（不放在 checkout / setup，最小暴露面）。
        # 注意：只有「執行期」失敗（health check、例外）能靠此處的 notifier 告警；
        # import 階段就死（如 selectolax ImportError）時 main.py 根本沒被執行 →
        # 由 job 末端的 `if: failure()` step 兜底（見下）。

      - name: Version data (diff + cache-busting)
        id: version
        run: python scripts/version_data.py
        # 輸出 changed=true|false、filename={YYYYMMDD}.json（最新 daily 檔名；無異動 → 跳過 commit）
        # BDD @business-rule @cache-busting：data/items/{g} 分類檔每日覆寫、URL 以 index.crawled_at 組 ?v= 穿透
        # BDD @edge-case @initial-setup：首次執行建立 api/items/{g}.json + api/daily/{date}.json + api/trends/ + api/index.json
        # BDD @business-rule @regression：無異動 → changed=false

      - name: Telegram notification hook (feature 006)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_hook.py
        continue-on-error: true    # 整合點尚未實作/失敗時不中斷 run
                                   # BDD @integration @placeholder：整合點不使工作流中斷
        # 位置在資料 commit 之前：telegram.json 異動可併入本次 commit（006 契約）
        # env：hook 需要憑證才會真的送出摘要（缺憑證 → graceful skip）；
        # 成功 run 亦發心跳摘要，TELEGRAM_NOTIFY_SUCCESS=0 可關閉。

      - name: Commit data changes
        if: steps.version.outputs.changed == 'true'   # 無異動 → 整步跳過（不產生空 commit）
                                                      # BDD @business-rule：資料無異動時跳過 commit
        env:
          GH_TOKEN: ${{ github.token }}               # GITHUB_TOKEN push（防迴圈，不觸發新 run）
        run: |
          git config user.name "coolpc-tracker[bot]"
          git config user.email "coolpc-tracker[bot]@users.noreply.github.com"
          git add data/    # data/ 為唯一真相（items/{g} + daily/ + checkpoints/ + meta.json + telegram.json）；api/ 不進版控，由 deploy 時重建
          # filename 可能為空（僅 checkpoint 或 items 異動），fallback 用日期
          FILENAME="${{ steps.version.outputs.filename }}"
          if [ -z "$FILENAME" ]; then
            FILENAME="$(date -u +%Y%m%d)"
          fi
          git commit -m "chore(data): 更新商品資料 ${FILENAME}"
          git pull --rebase        # 併入並發期間 main 上其他人類 commit；實質衝突 → step 失敗
          git push
        # push 失敗（權限不足/衝突）→ step 失敗 → run 失敗、異動停留工作目錄
        # BDD @error-handling：資料 commit 失敗時工作流失敗

      # ── 失敗兜底告警（2026-10 事故盲點）─────────────────────────────────
      # 事故：selectolax 1.0 移除 Modest backend → `from crawler.parser import ...`
      # 在 **import 階段** 即 ImportError，`crawler/main.py` 的 notifier 根本沒被執行，
      # 因此 main.py 內的告警路徑對「連程式都跑不起來」的故障完全無效。
      # 本 step 不依賴 crawler 是否成功啟動：只要本 job 任何一步失敗就發告警。
      # 置於 job 末端（commit 之後）：確保 commit 失敗也能告警，且不影響
      # 「telegram（continue-on-error）在 commit 之前」的既有契約與結構測試。
      - name: Notify failure on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_SLUG: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          # 訊息由 workflow 端組裝後以 `--text` 交給 hook（hook 的 `--text` 路徑
          # 不讀 meta.json，故不依賴 crawler 是否跑得起來；無需改 hook 核心邏輯）。
          MSG="$(printf '%s\n' \
            "🚨 [CoolPC 排程] 工作流失敗（crawl job）" \
            "workflow：${WORKFLOW_NAME}" \
            "分支：${REF_NAME}" \
            "commit：${COMMIT_SHA}" \
            "run：#${RUN_NUMBER}（run id ${RUN_ID}）" \
            "log：${SERVER_URL}/${REPO_SLUG}/actions/runs/${RUN_ID}" \
            "（workflow 兜底告警：可能為安裝 / import / 測試 / 爬取 / commit 階段失敗，詳見 log）")"
          python scripts/telegram_hook.py --text "$MSG"
        # hook 契約：缺憑證 → graceful skip（exit 0）；發送失敗只記 log，不拋例外。

  deploy:
    needs: crawl                  # crawl 失敗 → deploy 不啟動
                                  # BDD @error-handling：爬蟲失敗不部署 / build 失敗不部署
    runs-on: ubuntu-latest
    permissions:
      pages: write                # actions/deploy-pages 所需
      id-token: write             # GitHub Pages OIDC 所需；不需 contents write（權限最小化）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
                               # 關鍵：crawl job 在本 run 中途 push 了資料 commit；
                               # 預設 checkout 會取「觸發時點」的 GITHUB_SHA（舊資料），
                               # 顯式 ref 才能在 deploy 取回含最新資料 commit 的程式碼（規格 §1.4 Checkout）
        # 若 crawl 有 push，此處取回含最新資料 commit 的程式碼

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rebuild api/ (Issue #14: api/ not in git, rebuilt at deploy)
        run: python scripts/version_data.py
        # api/ 不進版控，deploy 前由 version_data.py 從 data/ 重建完整 api/ 層
        # version_data.py 讀 data/ 組裝 api/items/{g}.json + api/daily/ + api/trends/ + api/index.json
        # 無異動防線（meta.status==failed 或 total==0）仍有效——不寫任何檔 → build 拿不到 api/ → build 失敗不部署

      - name: Install & build frontend
        env:
          BASE_PATH: /${{ github.event.repository.name }}/   # Pages project site 基底路徑
        run: |
          cd web
          npm ci
          npm run build
        # vite.config.ts：build 收尾把 ../api/** 遞迴複製進 dist/api/；前端 runtime fetch index.json
        # build 失敗 → job 失敗 → 後續 upload/deploy step 不執行 → 不部署
        # BDD @error-handling：前端 build 失敗時不部署

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # 部署失敗 → run 標記失敗；Pages 平台保留上次成功部署（線上不中斷）
        # BDD @error-handling：部署失敗時保留上次部署版本
