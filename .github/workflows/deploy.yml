# .github/workflows/deploy.yml
# Push 前端程式碼時自動部署到 GitHub Pages（不跑爬蟲）
# 與 crawl.yml 分離：crawl 只管資料更新 + 部署，deploy 只管前端程式碼更新

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'docs/**'

permissions: {}

concurrency:
  group: pages-deploy        # 與 crawl.yml 共用 group，避免並發部署衝突
  cancel-in-progress: true   # 新 push 取消進行中的部署（前端改動優先）

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Rebuild api/ from data/
        run: python scripts/version_data.py
        # api/ 不進版控，deploy 前從 data/ 重建

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build frontend
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
